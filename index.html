<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Minhas Finanças</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita "piscar")
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- Tela de login -->
  <section id="auth" class="auth" hidden>
    <div class="auth-box">
      <img src="icon.svg" alt="" class="auth-logo">
      <h1>Minhas Finanças</h1>
      <p class="muted">Gastos, faturas e divisão de contas.</p>
      <form id="auth-form">
        <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
        <label>Senha<input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
        <button type="submit" class="btn primary" id="auth-submit">Entrar</button>
        <button type="button" class="btn link" id="auth-toggle">Não tem conta? Criar conta</button>
        <p id="auth-msg" class="msg" role="status"></p>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <button class="icon-btn" id="prev-month" aria-label="Mês anterior">‹</button>
      <div class="month-title" id="month-title"></div>
      <button class="icon-btn" id="next-month" aria-label="Próximo mês">›</button>
    </header>

    <main id="view"></main>

    <nav class="tabbar">
      <button data-tab="resumo" class="active"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg></span>Resumo</button>
      <button data-tab="gastos"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg></span>Gastos</button>
      <button class="fab" id="fab" aria-label="Novo gasto">+</button>
      <button data-tab="cartoes"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg></span>Cartões</button>
      <button data-tab="perfil"><span class="avatar avatar-tab" id="tab-avatar"></span>Perfil</button>
    </nav>
  </div>

  <!-- Folha (formulários) -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
